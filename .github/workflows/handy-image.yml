# Builds main into ghcr.io/<owner>/bambuddy:handy
# so a Dockge stack can pull it (deploy/handy/compose.yaml).
name: Handy image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bambuddy:handy
            ghcr.io/${{ github.repository_owner }}/bambuddy:sha-${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
